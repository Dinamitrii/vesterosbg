<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Вход · Админ</title><link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}"></head><body>
<div class="login-box">
  <a href="/" class="brand">{{ company }}<span>.</span></a>
  <h1>Администрация</h1>
  {% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}
  <form method="post">
    <label>Парола
      <input type="password" name="password" required autofocus>
    </label>
    <button class="submit" type="submit">Вход</button>
  </form>
  <p class="hint">Паролата се задава чрез променливата ADMIN_PASSWORD.</p>
</div>
</body></html>
